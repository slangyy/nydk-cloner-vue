services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: nydk-homepage-vue:latest
    container_name: nydk-homepage-vue
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:80"

  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: nydk-homepage-vue:dev
    container_name: nydk-homepage-vue-dev
    restart: unless-stopped
    ports:
      - "${DEV_PORT:-5173}:5173"
    volumes:
      - .:/app
      - /app/node_modules
